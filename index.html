<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planificateur Vol">
<meta name="theme-color" content="#0a1424">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Planificateur Vol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
/* Carte de nuit façon carte en route ; les résultats sont des strips de contrôle */
:root{
  color-scheme:dark;
  --ink:#0a1424;        /* fond, eau */
  --deck:#101c2e;       /* panneaux */
  --deck-2:#16243a;     /* champs, strips */
  --rule:#26364f;       /* séparations */
  --text:#dbe6f3;
  --sub:#8296b0;
  --route:#5ec8ff;      /* trait de route, accent */
  --atc:#ffb020;        /* contrôle IVAO */
  --lh:#b18cff; --mh:#5ec8ff; --sh:#4fe0a8;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --cond:'Barlow Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--text);font:15px/1.4 var(--body);}
button,input,select{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--route);outline-offset:2px;}
#map{position:fixed;inset:0;background:var(--ink);}
.leaflet-container{background:var(--ink);font-family:var(--body);}
.leaflet-control-attribution{background:rgba(10,20,36,.7)!important;color:var(--sub)!important;font-size:10px;}
.leaflet-control-attribution a{color:var(--sub)!important;}
.leaflet-bar a{background:var(--deck)!important;color:var(--text)!important;border-color:var(--rule)!important;}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--deck);color:var(--text);border:1px solid var(--rule);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.leaflet-popup-content-wrapper{border-radius:10px;}
.leaflet-container a.leaflet-popup-close-button{color:var(--sub);}

/* ── panneau principal ── */
#panel{position:fixed;z-index:1000;display:flex;flex-direction:column;background:rgba(16,28,46,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--rule);box-shadow:0 20px 50px rgba(0,0,0,.45);}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 6px;}
.brand img{width:28px;height:28px;border-radius:7px;}
.brand h1{font:700 24px/1 var(--cond);letter-spacing:.3px;}
.brand .upd{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;}
.handle{display:none;}

.form{padding:8px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;}
.row>*{min-width:0;}
.fld input[type=time]{min-width:0;}
.row{display:grid;gap:8px;}
.row.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.fld{position:relative;background:var(--deck-2);border:1px solid var(--rule);border-radius:8px;padding:7px 10px 8px;}
.fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:1px;}
.fld input,.fld select{width:100%;background:transparent;border:none;outline:none;font:600 19px/1.2 var(--cond);letter-spacing:.3px;}
.fld select{font:500 16px/1.3 var(--body);-webkit-appearance:none;appearance:none;cursor:pointer;}
.fld select option{background:var(--deck);}
.fld input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.7);}
.fld:focus-within{border-color:var(--route);}
.fld .hint{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#dep{text-transform:uppercase;}
.seg{display:flex;background:var(--deck-2);border:1px solid var(--rule);border-radius:8px;padding:3px;}
.seg button{flex:1;border:none;background:none;padding:6px;border-radius:6px;color:var(--sub);cursor:pointer;font-weight:500;}
.seg button.on{background:var(--rule);color:var(--text);}
#dep-menu{display:none;position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);z-index:5;max-height:300px;overflow-y:auto;
  background:var(--deck);border:1px solid var(--rule);border-radius:8px;box-shadow:0 14px 30px rgba(0,0,0,.5);}
.dep-opt{display:flex;align-items:baseline;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--rule);}
.dep-opt:hover{background:var(--deck-2);}
.dep-opt b{font:600 17px var(--cond);min-width:38px;}
.dep-opt span{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dep-opt em{font-style:normal;font-size:12px;color:var(--sub);}
.dep-more{padding:8px 12px;font-size:12px;color:var(--sub);}
.go{border:none;border-radius:8px;background:var(--route);color:#04213a;font-weight:600;font-size:16px;padding:11px;cursor:pointer;}
.go:active{transform:scale(.98);}

/* résumé replié de la recherche */
.summary{display:none;align-items:center;gap:10px;margin:4px 18px 10px;padding:9px 12px;background:var(--deck-2);border:1px solid var(--rule);border-radius:8px;cursor:pointer;}
.summary b{font:600 19px var(--cond);}
.summary span{font-size:13px;color:var(--sub);}
.summary .edit{margin-left:auto;color:var(--route);font-weight:600;font-size:14px;}
#panel.searched .form{display:none;}
#panel.searched .summary{display:flex;}
#panel.searched.editing .form{display:grid;}
#panel.searched.editing .summary{display:none;}

/* barre de résultats */
.rhead{display:none;padding:0 18px 8px;border-bottom:1px solid var(--rule);}
#panel.searched .rhead{display:block;}
.count{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}
.count b{font:700 28px/1 var(--cond);}
.count span{color:var(--sub);font-size:14px;}
.count .ivst{margin-left:auto;font-size:12px;color:var(--sub);}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;border:1px solid var(--rule);background:none;border-radius:999px;padding:4px 11px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;}
.chip.on{color:var(--text);border-color:var(--text);}
.chip[data-v=LH].on{color:var(--lh);border-color:var(--lh);}
.chip[data-v=MH].on{color:var(--mh);border-color:var(--mh);}
.chip[data-v=SH].on{color:var(--sh);border-color:var(--sh);}
.chip.atc.on{color:var(--ink);background:var(--atc);border-color:var(--atc);}
select.chip{-webkit-appearance:none;appearance:none;background:none;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat;}
select.chip option{background:var(--deck);color:var(--text);}
.chips+.chips{margin-top:6px;}

/* strips */
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 16px;display:none;}
#panel.searched #list{display:block;}
.strip{display:grid;grid-template-columns:6px 1fr auto;background:var(--deck-2);border:1px solid var(--rule);border-radius:4px;margin-bottom:6px;cursor:pointer;overflow:hidden;}
.strip:hover{border-color:#36506f;}
.strip.sel{border-color:var(--route);box-shadow:0 0 0 1px var(--route) inset;}
.strip .tab{background:var(--mh);}
.strip.LH .tab{background:var(--lh);} .strip.SH .tab{background:var(--sh);}
.strip .main{padding:7px 10px;min-width:0;border-right:1px dashed var(--rule);}
.strip .cs{font:700 20px/1.05 var(--cond);letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.strip .cs .atc{width:8px;height:8px;border-radius:50%;background:var(--atc);box-shadow:0 0 0 3px rgba(255,176,32,.2);}
.strip .rt{font:600 15px var(--cond);color:var(--route);letter-spacing:.3px;}
.strip .meta{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.strip .times{display:grid;grid-template-rows:1fr 1fr;text-align:right;min-width:78px;}
.strip .times div{padding:4px 10px;font:600 17px/1.1 var(--cond);}
.strip .times div+div{border-top:1px dashed var(--rule);}
.strip .times small{display:block;font:500 11px var(--body);color:var(--sub);}
.detail{grid-column:1/-1;display:none;padding:8px 12px 12px 16px;border-top:1px solid var(--rule);font-size:13px;color:var(--sub);}
.strip.sel .detail{display:block;}
.detail p{margin-bottom:4px;}
.detail .warn{color:var(--atc);margin:6px 0;}
.detail .warn b{display:block;}
.sb{display:inline-block;margin-top:6px;padding:7px 12px;border-radius:6px;background:var(--route);color:#04213a;font-weight:600;text-decoration:none;font-size:14px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;}
.sb.ghost{background:none;border:1px solid var(--route);color:var(--route);cursor:pointer;}
.more{display:block;width:100%;margin-top:6px;padding:10px;border:1px dashed var(--rule);background:none;border-radius:6px;color:var(--route);cursor:pointer;}
.empty{padding:30px 10px;text-align:center;color:var(--sub);}
.loading{padding:22px 18px;color:var(--sub);}

/* ── panneau aéroport ── */
#apt{position:fixed;z-index:1001;display:none;flex-direction:column;background:rgba(16,28,46,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule);box-shadow:0 20px 50px rgba(0,0,0,.45);}
.ah{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 8px;}
.ah b{font:700 30px/1 var(--cond);}
.ah span{display:block;font-size:13px;color:var(--sub);}
.ah .atcline{color:var(--atc);font-size:13px;margin-top:3px;}
.x{margin-left:auto;flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:none;color:var(--text);cursor:pointer;}
.atabs{display:flex;gap:6px;padding:0 16px 10px;}
.atabs button{flex:1;padding:7px;border:1px solid var(--rule);border-radius:6px;background:none;color:var(--sub);cursor:pointer;font-weight:600;}
.atabs button.on{color:var(--ink);background:var(--route);border-color:var(--route);}
#apt .alist{overflow-y:auto;padding:0 12px 14px;flex:1;}

/* ── commandes flottantes de la carte ── */
.mapctl{position:fixed;z-index:999;display:flex;gap:8px;align-items:center;}
.fab{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);background:rgba(16,28,46,.92);backdrop-filter:blur(10px);
  padding:8px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text);}
.fab .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--atc);}
.fab.on{border-color:var(--atc);}
.fab.on .dot{background:var(--atc);}
.note{position:fixed;z-index:998;font-size:12px;color:var(--sub);background:rgba(10,20,36,.8);padding:4px 9px;border-radius:6px;display:none;}

/* étiquettes sur la carte */
.apt-lbl div{display:inline-block;font:600 13px/1 var(--cond);letter-spacing:.4px;color:var(--text);background:rgba(10,20,36,.85);border:1px solid var(--rule);padding:2px 5px 3px;border-radius:3px;white-space:nowrap;cursor:pointer;}
.apt-lbl.main div{background:var(--route);color:#04213a;border-color:var(--route);}
.ivao-lbl div{display:inline-block;white-space:nowrap;font:600 12px/1 var(--cond);letter-spacing:.4px;color:var(--atc);background:rgba(10,20,36,.85);border:1px solid rgba(255,176,32,.5);padding:2px 5px 3px;border-radius:3px;}
.pop b{font:700 19px var(--cond);display:block;}
.pop p{font-size:13px;color:var(--sub);margin:2px 0;}
.pop .warn{color:var(--atc);}
.pop .sb{margin-top:8px;}

/* ── grand écran : panneau à gauche, aéroport à droite ── */
@media (min-width:900px){
  #panel{top:14px;left:14px;bottom:14px;width:400px;border-radius:14px;}
  #panel:not(.searched){bottom:auto;}
  #apt{top:14px;right:14px;bottom:14px;width:380px;border-radius:14px;}
  .mapctl{top:14px;right:14px;}
  body.apt-open .mapctl{right:408px;}
  .note{left:428px;bottom:14px;}
  .leaflet-top.leaflet-left{left:414px;}
}
/* ── téléphone : panneau en bas, déroulable ── */
@media (max-width:899px){
  #panel{left:0;right:0;bottom:0;max-height:calc(100% - var(--safe-top) - 60px);border-radius:16px 16px 0 0;padding-bottom:var(--safe-bot);border-bottom:none;}
  .handle{display:block;width:100%;height:22px;border:none;background:none;cursor:pointer;position:relative;flex-shrink:0;}
  .handle::after{content:'';position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--rule);}
  .brand{padding-top:2px;}
  #panel.searched{height:70%;}
  #panel.searched.low{height:auto;}
  #panel.searched.low #list,#panel.searched.low .chips{display:none;}
  #panel.searched.low .rhead{border-bottom:none;}
  #apt{left:0;right:0;bottom:0;height:62%;border-radius:16px 16px 0 0;padding-bottom:var(--safe-bot);}
  .mapctl{top:calc(var(--safe-top) + 10px);right:10px;}
  .note{left:10px;top:calc(var(--safe-top) + 12px);}
  .leaflet-top.leaflet-left{top:calc(var(--safe-top) + 44px);}
}
@media (prefers-reduced-motion:no-preference){
  #panel,#apt{transition:height .25s ease;}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="mapctl">
  <button class="fab" id="ivao-btn" aria-pressed="false"><span class="dot"></span>Contrôle IVAO</button>
</div>
<div class="note" id="note"></div>

<aside id="panel">
  <button class="handle" id="handle" aria-label="Agrandir ou réduire"></button>
  <div class="brand">
    <img src="icons/icon-192.png" alt="">
    <h1>Planificateur Vol</h1>
    <div class="upd" id="upd"></div>
  </div>
  <div class="loading" id="loading">Chargement des vols…</div>

  <form class="form" id="form" style="display:none" onsubmit="doSearch();return false">
    <div class="fld">
      <label for="airline">Compagnie</label>
      <select id="airline"></select>
    </div>
    <div class="seg" role="group" aria-label="Départ">
      <button type="button" class="on" id="mode-single" onclick="setMode('single')">Depuis un aéroport</button>
      <button type="button" id="mode-multi" onclick="setMode('multi')">Depuis partout</button>
    </div>
    <div class="fld" id="dep-fld">
      <label for="dep">Aéroport de départ</label>
      <input type="text" id="dep" value="CDG" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code ou ville">
      <div class="hint" id="dep-hint"></div>
      <div id="dep-menu"></div>
    </div>
    <div class="row three">
      <div class="fld"><label for="depTime">Départ</label><input type="time" id="depTime"></div>
      <div class="fld"><label for="arrFrom">Arrivée dès</label><input type="time" id="arrFrom"></div>
      <div class="fld"><label for="arrTo">jusqu'à</label><input type="time" id="arrTo"></div>
    </div>
    <button class="go" type="submit">Trouver les vols</button>
  </form>

  <div class="summary" id="summary" onclick="editSearch()">
    <div><b id="sum-title"></b><br><span id="sum-sub"></span></div>
    <span class="edit">Modifier</span>
  </div>

  <div class="rhead">
    <div class="count"><b id="count-n">0</b><span id="count-lbl">vols</span><span class="ivst" id="ivao-status"></span></div>
    <div class="chips" id="co-chips">
      <button class="chip on" data-v="all">Tous</button>
      <button class="chip" data-v="LH">Long-courrier</button>
      <button class="chip" data-v="MH">Moyen-courrier</button>
      <button class="chip" data-v="SH">Court-courrier</button>
    </div>
    <div class="chips">
      <select class="chip" id="reg" aria-label="Région">
        <option value="all">Toutes régions</option><option value="france">France</option><option value="europe">Europe</option>
        <option value="ameriques">Amériques</option><option value="afrique">Afrique</option><option value="moyen-orient">Moyen-Orient</option>
        <option value="asie">Asie</option><option value="oceanie">Océanie</option><option value="dom">DOM-TOM</option>
      </select>
      <button class="chip atc" id="ctl-btn">Sans contrôle IVAO</button>
    </div>
  </div>
  <div id="list"></div>
</aside>

<aside id="apt"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const PAGE=120, MAP_MAX=400;
const CO_COLOR={LH:'#b18cff',MH:'#5ec8ff',SH:'#4fe0a8'};
const CO_LABEL={LH:'Long-courrier',MH:'Moyen-courrier',SH:'Court-courrier'};

let ROUTES=[], AIRPORTS={}, AIRLINES={}, META={}, SECTORS={};
let lastResults=[], shown=PAGE, fCo='all', fReg='all', curMode='single', curAirline='AFR';
let map, flightLayer, ivaoLayer, mapLines=[], selFlight=null, selApt=null, selTab='dep', mapR=[];

// ── utilitaires ──
function nextHour(){const n=new Date(),h=n.getMinutes()===0?n.getHours():n.getHours()+1;return String(h%24).padStart(2,'0')+':00';}
function pt(s){const[h,m]=s.split(':').map(Number);return h*60+m;}
function addM(b,m){return((b+m)%1440+1440)%1440;}
function ft(t){return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function fd(m){return Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'');}
function inW(a,f,t){return f<=t?a>=f&&a<=t:a>=f||a<=t;}
const PARIS=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
function utcToParis(h){if(!h)return'';const[a,b]=h.split(':').map(Number),d=new Date();d.setUTCHours(a,b,0,0);return PARIS.format(d);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function aptName(c){const a=AIRPORTS[c];return a?(a[3]||a[2]):'';}
function airlineName(c){return(AIRLINES[c]&&AIRLINES[c][0])||c;}
const wide=()=>matchMedia('(min-width:900px)').matches;
const keyOf=x=>x.al+'|'+x.dep+'|'+x.arr+'|'+x.cs;

// ── chargement : dépôt GitHub d'abord (à jour dès le commit du robot), sinon fichiers du site ──
const RAW='https://raw.githubusercontent.com/Poldou/vols-af/main/';
async function getJSON(name,required){
  const t='?t='+Date.now();
  for(const base of [RAW,'']){try{const x=await fetch(base+name+t);if(x.ok)return await x.json();}catch(e){}}
  if(required)throw new Error(name+' introuvable');
  return {};
}
async function loadData(){
  initMap();
  try{
    const [r,a,m,s]=await Promise.all([getJSON('routes.json',true),getJSON('airports.json',true),getJSON('meta.json',false),getJSON('data/ivao_sectors.json',false)]);
    ROUTES=r.rows.map(row=>Object.fromEntries(r.cols.map((c,i)=>[c,row[i]])));
    AIRLINES=r.airlines||{}; AIRPORTS=a; META=m; SECTORS=s||{};
    onLoaded();
    loadIvao(); setInterval(()=>{if(!document.hidden)loadIvao();},60000);
  }catch(e){
    document.getElementById('loading').textContent='Les données de vols ne se chargent pas ('+e.message+'). Vérifie la connexion puis recharge la page.';
  }
}
function onLoaded(){
  document.getElementById('loading').style.display='none';
  document.getElementById('form').style.display='';
  const sel=document.getElementById('airline');
  const codes=Object.keys(AIRLINES).sort((x,y)=>(y==='AFR')-(x==='AFR')||AIRLINES[y][2]-AIRLINES[x][2]);
  sel.innerHTML='<option value="all">Toutes les compagnies</option>'+codes.map(c=>`<option value="${c}">${esc(AIRLINES[c][0]||c)} (${c})</option>`).join('');
  sel.value=AIRLINES.AFR?'AFR':'all'; curAirline=sel.value;
  sel.addEventListener('change',()=>{curAirline=sel.value;refreshDepList();});
  refreshDepList();
  const days=META.days||[];
  document.getElementById('upd').innerHTML=`${ROUTES.length.toLocaleString('fr-FR')} routes${days.length?'<br>vols du '+days[days.length-1].split('-').reverse().slice(0,2).join('/'):''}`;
  const nh=nextHour(); document.getElementById('depTime').value=nh; updateArrWindows(nh);
}

// ── aéroport de départ : liste complète au clic, filtrée à la frappe ──
let DEP_COUNTS={}, DEP_ORDER=[];
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function refreshDepList(){
  DEP_COUNTS={};
  ROUTES.forEach(r=>{if(curAirline==='all'||r.al===curAirline)DEP_COUNTS[r.dep]=(DEP_COUNTS[r.dep]||0)+1;});
  DEP_ORDER=Object.keys(DEP_COUNTS).sort((a,b)=>DEP_COUNTS[b]-DEP_COUNTS[a]);
  const inp=document.getElementById('dep');
  if(!DEP_COUNTS[inp.value.trim().toUpperCase()]&&DEP_ORDER.length)inp.value=DEP_ORDER.includes('CDG')?'CDG':DEP_ORDER[0];
  depHint();
}
function showDepMenu(filter){
  const q=norm(document.getElementById('dep').value.trim());
  let list=DEP_ORDER;
  if(filter&&q){const a1=[],a2=[];DEP_ORDER.forEach(c=>{const a=AIRPORTS[c]||[];if(c.toLowerCase().startsWith(q))a1.push(c);else if(norm(a[3]).includes(q)||norm(a[2]).includes(q))a2.push(c);});list=a1.concat(a2);}
  const s=list.slice(0,2000), menu=document.getElementById('dep-menu');
  menu.innerHTML=s.length?s.map(c=>{const a=AIRPORTS[c]||[];return `<div class="dep-opt" data-c="${c}"><b>${c}</b><span>${esc(a[3]||a[2]||'')}</span><em>${DEP_COUNTS[c]}</em></div>`;}).join('')
    +(list.length>s.length?`<div class="dep-more">${list.length-s.length} autres : tape le code ou la ville</div>`:''):'<div class="dep-more">Aucun aéroport ne correspond</div>';
  menu.style.display='block';
}
function hideDepMenu(){document.getElementById('dep-menu').style.display='none';}
function pickDep(c){const i=document.getElementById('dep');i.value=c;depHint();hideDepMenu();i.blur();}
function depHint(){const c=document.getElementById('dep').value.trim().toUpperCase(),a=AIRPORTS[c];document.getElementById('dep-hint').textContent=a?a[2]:(c?'Aucun vol connu au départ de ce code':'');}
(()=>{
  const inp=document.getElementById('dep'),menu=document.getElementById('dep-menu');
  inp.addEventListener('focus',()=>{inp.select();showDepMenu(false);});
  inp.addEventListener('input',()=>{depHint();showDepMenu(true);});
  inp.addEventListener('blur',()=>setTimeout(hideDepMenu,150));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=menu.querySelector('.dep-opt');if(f)pickDep(f.dataset.c);e.preventDefault();}if(e.key==='Escape')hideDepMenu();});
  menu.addEventListener('mousedown',e=>e.preventDefault());
  menu.addEventListener('click',e=>{const o=e.target.closest('.dep-opt');if(o)pickDep(o.dataset.c);});
})();

  const dep=document.getElementById('dep').value.trim().toUpperCase();

    if(curAirline!=='all'&&r.al!==curAirline)return false;
    if(curMode==='single'&&r.dep!==dep)return false;
    return inW(addM(depMin,r.dur),arrFrom,arrTo);
  }).map(r=>({...r,depMin,arrMin:addM(depMin,r.dur)})).sort((a,b)=>a.dur-b.dur||b.n-a.n);
  const who=curAirline==='all'?'Toutes compagnies':airlineName(curAirline);

function simbriefUrl(x){
  const fnum=(x.fn||'').replace(/^[A-Z0-9]{2}/,''), csnum=(x.cs||'').slice(3);
  const num=/^\d/.test(fnum)?fnum:(/^\d+$/.test(csnum)?csnum:'');
  const p=new URLSearchParams({orig:x.dep,dest:x.arr});
  if(/^[A-Z]{3}$/.test(x.al)){p.set('airline',x.al);if(num)p.set('fltnum',num);if(x.cs&&x.cs!==x.al+num)p.set('callsign',x.cs);}
  return 'https://www.simbrief.com/system/dispatch.php?'+p.toString();
}

// ── carte ──
function greatCircle(lat1,lon1,lat2,lon2,n=64){
  const d2r=d=>d*Math.PI/180,r2d=r=>r*180/Math.PI;
  const p1=d2r(lat1),l1=d2r(lon1),p2=d2r(lat2),l2=d2r(lon2);
  const d=2*Math.asin(Math.sqrt(Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin((l2-l1)/2)**2));
  if(d===0)return[[lat1,lon1]];
  const pts=[];let prev=null;
  for(let i=0;i<=n;i++){
    const f=i/n,A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    const x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2), y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2), z=A*Math.sin(p1)+B*Math.sin(p2);
    let lon=r2d(Math.atan2(y,x));
    if(prev!==null){while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;}
    prev=lon; pts.push([r2d(Math.atan2(z,Math.sqrt(x*x+y*y))),lon]);
  }
  return pts;
}
function initMap(){
  map=L.map('map',{zoomControl:true,worldCopyJump:true,attributionControl:true}).setView([46,8],4);
  map.attributionControl.setPrefix(false);
  const base=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,attribution:'Esri, HERE, Garmin, © OpenStreetMap'}).addTo(map);
  let fails=0; base.on('tileerror',()=>{if(++fails===3){map.removeLayer(base);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);}});
  map.createPane('ivao').style.zIndex=350;
  map.createPane('ivaoLbl').style.zIndex=640;
  flightLayer=L.layerGroup().addTo(map);
  map.on('click',()=>{if(selApt)closeApt(true);});
}
function pads(){

function popupHtml(x){
  return `<div class="pop"><b>${esc(x.cs)} · ${x.dep} – ${x.arr}</b><p>${esc(airlineName(x.al))}${x.ac?' · '+esc(x.ac):''}</p><p>${ft(x.depMin)} → ${ft(x.arrMin)} · ${fd(x.dur)}</p>${ivaoWarn(x,true)}<a class="sb" href="${simbriefUrl(x)}" target="_blank" rel="noopener">Préparer dans Simbrief</a></div>`;
}
function drawFlights(list,focus){
  flightLayer.clearLayers(); mapLines=[];
  const bounds=[], apts={};
  list.forEach(x=>{
    const dc=AIRPORTS[x.dep],ac=AIRPORTS[x.arr]; if(!dc||!ac)return;
    const color=CO_COLOR[x.co]||'#5ec8ff';
    (apts[x.dep]=apts[x.dep]||{dep:0,arr:0}).dep++; (apts[x.arr]=apts[x.arr]||{dep:0,arr:0}).arr++;
    const pts=greatCircle(dc[0],dc[1],ac[0],ac[1]);
    const line=L.polyline(pts,{color,weight:1.6,opacity:.7}).bindPopup(()=>popupHtml(x)).addTo(flightLayer);
    mapLines.push({line,x,pts}); bounds.push(pts[0],pts[pts.length-1]);
  });
  Object.entries(apts).forEach(([c,o])=>{
    const a=AIRPORTS[c], main=focus?c===focus:o.dep>0;
    const dot=L.circleMarker([a[0],a[1]],{radius:main?6:4,fillColor:main?'#5ec8ff':'#0a1424',color:main?'#0a1424':'#dbe6f3',weight:main?2:1.5,fillOpacity:1}).addTo(flightLayer);
    const lbl=L.marker([a[0],a[1]],{icon:L.divIcon({className:'apt-lbl'+(main?' main':''),html:`<div>${c}</div>`,iconAnchor:[-7,9]})}).addTo(flightLayer);
    const open=e=>{L.DomEvent.stopPropagation(e);selectApt(c,true);};
    dot.on('click',open); lbl.on('click',open);
  });
  highlight();
  return bounds;
}
function highlight(){
  mapLines.forEach(({line,x})=>{
    const on=selFlight?keyOf(x)===selFlight:selApt?(selTab==='dep'?x.dep===selApt:x.arr===selApt):true;
    const dim=selFlight||selApt;
    line.setStyle({weight:on&&dim?3.2:1.6,opacity:on?(dim?1:.7):.18});
    if(on&&dim)line.bringToFront();
  });
}
function drawAll(fit){
  const note=document.getElementById('note');
  note.style.display=mapR.length>MAP_MAX?'block':'none';
  note.textContent=`${MAP_MAX} vols tracés sur ${mapR.length} · touche un aéroport pour tous ses vols`;

function focusFlight(x){
  let m=mapLines.find(l=>keyOf(l.x)===keyOf(x));
  if(!m){drawFlights([...mapR.slice(0,MAP_MAX),x],selApt);m=mapLines.find(l=>keyOf(l.x)===keyOf(x));}
  highlight();
  if(m){map.fitBounds(L.latLngBounds(m.pts),{...pads(),maxZoom:8});map.once('moveend',()=>m.line.openPopup(m.pts[Math.floor(m.pts.length/2)]));}
}

// ===== Contrôle IVAO en ligne (flux public, chaque minute) + limites des secteurs (data/ivao_sectors.json) =====
const IVAO_URL='https://api.ivao.aero/v2/tracker/whazzup';
const APT_POS=['DEL','GND','TWR','APP','DEP'];
let IVAO=null, ivaoErr=null, ivaoShow=false, hideCtl=false, ctrlCache={};
const uniqPos=a=>APT_POS.filter(p=>a.includes(p));
function bboxOf(polys){let a=90,b=-90,c=180,d=-180;polys.forEach(p=>p.forEach(([la,lo])=>{a=Math.min(a,la);b=Math.max(b,la);c=Math.min(c,lo);d=Math.max(d,lo);}));return[a,b,c,d];}
function sectorPolys(cs,center){
  if(SECTORS[cs])return SECTORS[cs].p;
  // un indicatif de FIR entière (LFFF_CTR) couvre tous ses sous-secteurs
  const all=Object.values(SECTORS).filter(s=>s.t==='CTR'&&s.c===center).flatMap(s=>s.p);
  return all.length?all:null;
}
function parseIvao(j){
  const atcs=(j.clients&&j.clients.atcs)||[], apts={}, ctrs=[], apps=[];
  atcs.forEach(a=>{
    const cs=String(a.callsign||'').toUpperCase(), parts=cs.split('_');
    const ap=a.atcPosition||null, sc=a.subcenter||null;
    const pos=String((a.atcSession&&a.atcSession.position)||(ap&&ap.position)||(sc&&sc.position)||parts[parts.length-1]).toUpperCase();
    const freq=(a.atcSession&&a.atcSession.frequency)||(ap&&ap.frequency)||(sc&&sc.frequency)||'';
    const rm=(ap&&ap.regionMap)||(sc&&sc.regionMap)||null;
    const own=Array.isArray(rm)?rm.map(p=>[+(p.lat??p.latitude),+(p.lng??p.lon??p.longitude)]).filter(p=>isFinite(p[0])&&isFinite(p[1])):[];
    const lt=a.lastTrack||{};
    const it={cs,pos,freq,lat:lt.latitude,lon:lt.longitude};
    if(APT_POS.includes(pos)){
      it.icao=String((ap&&ap.airportId)||parts[0]).toUpperCase();(apts[it.icao]=apts[it.icao]||[]).push(it);
      if(pos==='APP'||pos==='DEP'){it.polys=SECTORS[cs]?SECTORS[cs].p:(own.length>2?[own]:null);if(it.polys)apps.push(it);}
    }else if(pos==='CTR'||pos==='FSS'){
      it.polys=own.length>2?[own]:sectorPolys(cs,String((sc&&sc.centerId)||parts[0]).toUpperCase());
      if(it.polys)it.bbox=bboxOf(it.polys);
      ctrs.push(it);
    }
  });
  return {apts,ctrs,apps,n:atcs.length,at:new Date()};
}
function pip(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[yi,xi]=poly[i],[yj,xj]=poly[j];if((yi>p[0])!==(yj>p[0])&&p[1]<(xj-xi)*(p[0]-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function controlInfo(x){
  if(!IVAO)return null;
  const k=x.dep+'|'+x.arr; if(k in ctrlCache)return ctrlCache[k];
  const d=AIRPORTS[x.dep], a=AIRPORTS[x.arr];
  const dep=uniqPos((IVAO.apts[d&&d[5]]||[]).map(i=>i.pos)), arr=uniqPos((IVAO.apts[a&&a[5]]||[]).map(i=>i.pos));
  let ctr=[];
  if(d&&a&&IVAO.ctrs.length){
    const pts=greatCircle(d[0],d[1],a[0],a[1],60).map(([la,lo])=>[la,((lo+540)%360)-180]);
    ctr=IVAO.ctrs.filter(c=>c.polys&&pts.some(p=>p[0]>=c.bbox[0]&&p[0]<=c.bbox[1]&&p[1]>=c.bbox[2]&&p[1]<=c.bbox[3]&&c.polys.some(pl=>pip(p,pl)))).map(c=>c.cs);
  }
  return ctrlCache[k]=(dep.length||arr.length||ctr.length)?{dep,arr,ctr:[...new Set(ctr)],di:d&&d[5],ai:a&&a[5]}:null;
}
function ivaoWarn(x,compact){
  const c=controlInfo(x); if(!c)return '';
  const parts=[];
  if(c.dep.length)parts.push(`au départ (${c.di} ${c.dep.join(', ')})`);
  if(c.ctr.length)parts.push(`en route (${c.ctr.join(', ')})`);
  if(c.arr.length)parts.push(`à l'arrivée (${c.ai} ${c.arr.join(', ')})`);
  return compact?`<p class="warn">Contrôlé sur IVAO ${esc(parts.join(', '))}</p>`
    :`<div class="warn"><b>Ce vol est contrôlé sur IVAO en ce moment</b>${esc(parts.join(', '))}</div>`;
}
async function loadIvao(){
  try{const res=await fetch(IVAO_URL,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);IVAO=parseIvao(await res.json());ivaoErr=null;}
  catch(e){ivaoErr=e.message||'erreur';}
  ctrlCache={};
  const st=document.getElementById('ivao-status');
  st.textContent=ivaoErr?`IVAO injoignable (${ivaoErr})`:`IVAO ${IVAO.at.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})} · ${IVAO.n} contrôleurs`;
  drawIvao();
  if(!lastResults.length)return;
  if(hideCtl){renderResults(false);return;}
  renderList(mapR);
  if(selApt)openApt(selApt);
}
function drawIvao(){
  if(ivaoLayer){map.removeLayer(ivaoLayer);ivaoLayer=null;}
  if(!ivaoShow||!IVAO)return;
  ivaoLayer=L.layerGroup().addTo(map);
  const zone=(polys,style)=>polys.forEach(p=>L.polygon(p,{pane:'ivao',interactive:false,...style}).addTo(ivaoLayer));
  const label=(ll,txt)=>L.marker(ll,{pane:'ivaoLbl',interactive:false,icon:L.divIcon({className:'ivao-lbl',html:`<div>${esc(txt)}</div>`,iconAnchor:[24,8]})}).addTo(ivaoLayer);
  IVAO.ctrs.forEach(c=>{
    if(c.polys){zone(c.polys,{color:'#ffb020',weight:1.4,opacity:.9,fillColor:'#ffb020',fillOpacity:.07});label(L.polygon(c.polys[0]).getBounds().getCenter(),`${c.cs} ${c.freq}`);}
    else if(isFinite(c.lat)){L.circleMarker([c.lat,c.lon],{pane:'ivao',radius:5,color:'#ffb020',weight:2,fill:false,interactive:false}).addTo(ivaoLayer);label([c.lat,c.lon],`${c.cs} ${c.freq}`);}
  });
  IVAO.apps.forEach(c=>zone(c.polys,{color:'#ffb020',weight:1,dashArray:'4 4',opacity:.8,fillColor:'#ffb020',fillOpacity:.05}));
  const byIcao={}; Object.keys(AIRPORTS).forEach(k=>{if(AIRPORTS[k][5])byIcao[AIRPORTS[k][5]]=AIRPORTS[k];});
  Object.entries(IVAO.apts).forEach(([icao,list])=>{
    const a=byIcao[icao], ll=a?[a[0],a[1]]:(isFinite(list[0].lat)?[list[0].lat,list[0].lon]:null); if(!ll)return;
    L.circleMarker(ll,{pane:'ivao',radius:11,color:'#ffb020',weight:2,fill:false,interactive:false}).addTo(ivaoLayer);
    L.marker(ll,{pane:'ivaoLbl',interactive:false,icon:L.divIcon({className:'ivao-lbl',html:`<div>${icao} ${uniqPos(list.map(i=>i.pos)).join(' ')}</div>`,iconAnchor:[-13,-6]})}).addTo(ivaoLayer);
  });
}
document.getElementById('ivao-btn').addEventListener('click',e=>{
  ivaoShow=!ivaoShow; const b=e.currentTarget; b.classList.toggle('on',ivaoShow); b.setAttribute('aria-pressed',ivaoShow); drawIvao();
});

loadData();
</script>
